$kind: http-example
request:
  url: "{{baseUrl}}"
  method: POST
  headers:
    Content-Type: application/json
  body:
    type: text
    content: |-
      {
        "action": "CREATE_TRANSACTION",
        "data": {
          "transactionType": "EXPENSE",
          "transactionDate": "21-09-2026",
          "amount": 100,
          "categoryId": "CAT001",
          "paymentMethod": "BANK",
          "paidFromAccountId": "ACC001",
          "notes": "Groceries"
        }
      }
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: |-
      {
        "success": true,
        "message": "Transaction created successfully",
        "data": {
          "transactionId": "TXN-<generated>"
        }
      }
order: 1000
