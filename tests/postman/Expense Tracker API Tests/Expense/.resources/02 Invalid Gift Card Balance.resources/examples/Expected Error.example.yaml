$kind: http-example
request:
  url: "{{baseUrl}}"
  method: POST
  headers:
    Content-Type: application/json
  body:
    type: text
    content: |-
      {
        "action": "CREATE_TRANSACTION",
        "data": {
          "transactionType": "EXPENSE",
          "transactionDate": "21-09-2026",
          "amount": 5000,
          "categoryId": "CAT001",
          "paymentMethod": "GIFT_CARD",
          "paidFromAccountId": "ACC004",
          "notes": "Gift card insufficient balance"
        }
      }
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: |-
      {
        "success": false,
        "error": {
          "code": "INSUFFICIENT_GIFT_CARD_BALANCE",
          "message": "Gift card balance is insufficient for this transaction."
        }
      }
order: 1000
