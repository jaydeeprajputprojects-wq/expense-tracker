$kind: http-example
request:
  url: "{{baseUrl}}"
  method: POST
  headers:
    Content-Type: application/json
  body:
    type: text
    content: |-
      {
        "action": "CREATE_TRANSACTION",
        "data": {
          "transactionType": "EXPENSE",
          "transactionDate": "31-02-2026",
          "amount": 100,
          "categoryId": "CAT001",
          "paymentMethod": "BANK",
          "paidFromAccountId": "ACC001",
          "notes": "Invalid date"
        }
      }
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: |-
      {
        "success": false,
        "error": {
          "code": "INVALID_TRANSACTION_DATE",
          "message": "Transaction date is not a valid calendar date."
        }
      }
order: 1000
