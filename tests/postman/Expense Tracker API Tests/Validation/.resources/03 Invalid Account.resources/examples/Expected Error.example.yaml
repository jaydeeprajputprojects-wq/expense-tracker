$kind: http-example
request:
  url: "{{baseUrl}}"
  method: POST
  headers:
    Content-Type: application/json
  body:
    type: text
    content: |-
      {
        "action": "CREATE_TRANSACTION",
        "data": {
          "transactionType": "EXPENSE",
          "transactionDate": "21-09-2026",
          "amount": 100,
          "categoryId": "CAT001",
          "paymentMethod": "BANK",
          "paidFromAccountId": "ACC999",
          "notes": "Invalid account"
        }
      }
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: |-
      {
        "success": false,
        "error": {
          "code": "ACCOUNT_NOT_FOUND",
          "message": "Account not found."
        }
      }
order: 1000
