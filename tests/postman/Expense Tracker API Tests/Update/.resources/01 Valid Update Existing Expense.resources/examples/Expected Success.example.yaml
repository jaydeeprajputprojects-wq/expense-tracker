$kind: http-example
request:
  url: "{{baseUrl}}"
  method: POST
  headers:
    Content-Type: application/json
  body:
    type: text
    content: |-
      {
        "action": "UPDATE_TRANSACTION",
        "transactionId": "TXN-000001",
        "data": {
          "transactionType": "EXPENSE",
          "transactionDate": "20-09-2026",
          "amount": 2000,
          "categoryId": "CAT001",
          "paymentMethod": "BANK",
          "paidFromAccountId": "ACC001",
          "notes": "Updated expense"
        }
      }
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: |-
      {
        "success": true,
        "message": "Transaction updated successfully",
        "data": {
          "transactionId": "TXN-000001",
          "transaction": {
            "Transaction_ID": "TXN-000001",
            "Transaction_Date": "20-09-2026",
            "Transaction_Type": "EXPENSE",
            "Amount": 2000,
            "Category_ID": "CAT001",
            "Payment_Method": "BANK",
            "Paid_From_Account_ID": "ACC001",
            "Notes": "Updated expense",
            "Created_Date": "2026-09-01",
            "Updated_Date": "2026-09-22T10:12:00.000Z",
            "Status": "ACTIVE"
          }
        }
      }
order: 1000
