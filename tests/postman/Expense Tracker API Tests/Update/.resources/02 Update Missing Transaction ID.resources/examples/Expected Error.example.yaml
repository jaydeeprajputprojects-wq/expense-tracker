  method: POST
  headers:
    Content-Type: application/json
  body:
    type: text
    content: |-
      {
        "action": "UPDATE_TRANSACTION",
        "transactionId": "",
        "data": {
          "transactionType": "EXPENSE",
          "transactionDate": "21-09-2026",
          "amount": 1500,
          "categoryId": "CAT001",
          "paymentMethod": "BANK",
          "paidFromAccountId": "ACC001",
          "notes": "Blank ID update"
