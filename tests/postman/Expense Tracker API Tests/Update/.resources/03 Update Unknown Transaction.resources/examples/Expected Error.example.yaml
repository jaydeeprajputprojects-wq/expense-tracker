$kind: http-example
request:
  url: "{{baseUrl}}"
  method: POST
  headers:
    Content-Type: application/json
  body:
    type: text
    content: |-
      {
        "action": "UPDATE_TRANSACTION",
        "transactionId": "TXN-999999",
        "data": {
          "transactionType": "EXPENSE",
          "transactionDate": "22-09-2026",
          "amount": 500,
          "categoryId": "CAT001",
          "paymentMethod": "BANK",
          "paidFromAccountId": "ACC001",
          "notes": "Unknown transaction update"
        }
      }
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: |-
      {
        "success": false,
        "error": {
          "code": "TRANSACTION_NOT_FOUND",
          "message": "Transaction not found"
        }
      }
order: 1020
